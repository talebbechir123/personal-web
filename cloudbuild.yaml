# GCP Cloud Build — builds, pushes, and deploys to Cloud Run
# Usage: gcloud builds submit --config cloudbuild.yaml
# Required substitutions (set in Cloud Build trigger or pass with --substitutions):
#   _REGION: e.g. us-central1
#   _SERVICE: e.g. atb-portfolio

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '-t'
      - 'gcr.io/$PROJECT_ID/$_SERVICE:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/$_SERVICE:latest'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - '--all-tags'
      - 'gcr.io/$PROJECT_ID/$_SERVICE'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '$_SERVICE'
      - '--image=gcr.io/$PROJECT_ID/$_SERVICE:$COMMIT_SHA'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=3000'
      - '--memory=256Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=3'

images:
  - 'gcr.io/$PROJECT_ID/$_SERVICE:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/$_SERVICE:latest'

options:
  logging: CLOUD_LOGGING_ONLY
